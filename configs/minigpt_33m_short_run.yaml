# 33M本地短验证：固定16K pilot数据，仅验收数值、完整验证与checkpoint恢复。
# 沿用唯一模型配置；每次更新处理2*512=1024 tokens，不代表正式预训练。
model_config: minigpt_33m.yaml
training:
  batch_size: 2
  max_steps: 100
  learning_rate: 0.0003
  min_learning_rate: 0.00003
  warmup_steps: 5
  lr_decay_steps: 100
  betas: [0.9, 0.95]
  eps: 0.00000001
  weight_decay: 0.1
  max_grad_norm: 1.0
  device: cuda
  precision: bfloat16
  seed: 42
  log_interval: 10
  eval_interval: 50
  # 本轮在50/100步退出时保存final；不额外复制同一步的完整优化器checkpoint。
  save_interval: 1000
data:
  # 路径相对于本YAML所在的configs/；不读取或覆盖旧2048数据/权重。
  train_path: ../data/processed/pilot_tokens_16k_v1/train.bin
  valid_path: ../data/processed/pilot_tokens_16k_v1/valid.bin
  tokenizer_path: ../data/processed/pilot_tokenizer_16k_v1.json
