[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "minigpt-cn"
version = "0.1.0"
description = "A Chinese Decoder-only Transformer implemented from scratch"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "IniJyou" }
]
dependencies = [
    "torch",
    "numpy>=1.26",
    "PyYAML>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E4/E7/E9: 基础格式错误，F: 代码错误，I: import 排序。
select = ["E4", "E7", "E9", "F", "I"]
