[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "minigpt-cn"
version = "0.1.0"
description = "A Chinese Decoder-only Transformer implemented from scratch"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "IniJyou" }
]
dependencies = [
    "torch",
    "numpy>=1.26",
    "PyYAML>=6.0",
    "tqdm>=4.66",
    "regex>=2024.0",
    # 与已验收中文 pilot 使用同一繁简转换实现和字典版本。
    "OpenCC==1.4.2",
    # 仅解析本地维基标记；不访问网站或展开远程模板。
    "mwparserfromhell==0.7.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
# 仅一致性验收工具的原作业参考模型需要 einops；项目模型本身不依赖它。
migration = ["einops>=0.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E4/E7/E9: 基础格式错误，F: 代码错误，I: import 排序。
select = ["E4", "E7", "E9", "F", "I"]
